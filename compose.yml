services:
  tikket:
    build: .
    image: tikket:latest
    container_name: tikket
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - tikket-data:/data
    # Bound to localhost only. Put a reverse proxy (e.g. Nginx Proxy Manager) in front,
    # or remove `ports` and attach the proxy to the same Docker network instead.
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tikket-data:
