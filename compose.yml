# Tikket – portable Docker Compose definition.
#
# Works unchanged with plain `docker compose` and with Coolify's Docker Compose build pack
# (Traefik or Caddy). It contains no proxy-specific labels and publishes no host port:
# the app listens on port 3000 inside the Compose network only.
#
#   Optional extras (stack them with -f):
#     compose.local-port.yml     publish 127.0.0.1:${HOST_PORT:-3000} for direct local access
#     compose.ghcr.yml           run the prebuilt image from GitHub Container Registry
#   External reverse proxy (e.g. Nginx Proxy Manager) on a shared Docker network:
#     compose.external-proxy.yml (this file + one external network; see docs/deployment-coolify.md)
#
# Configuration is read from the environment / an `.env` file next to this file (see .env.example).
# Never commit real secrets.

services:
  tikket:
    build:
      context: .
    restart: unless-stopped
    # Reachable by other containers on the same network (and by Coolify's proxy) without
    # publishing anything on the host.
    expose:
      - '3000'
    environment:
      # Public URL users open (scheme + host, no trailing slash). Required.
      ORIGIN: ${ORIGIN:?Set ORIGIN to the public URL, e.g. https://tikket.example.com}
      # Base for invitation / password-reset links; defaults to ORIGIN.
      APP_URL: ${APP_URL:-}
      # ≥ 32 random characters (openssl rand -base64 48). If empty, a secret is generated once
      # and stored in the data volume.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Trusted proxy: header carrying the client IP and number of trusted proxy hops.
      # Leave ADDRESS_HEADER empty unless a reverse proxy you control sits in front.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10M}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-25M}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      # REST API requests per minute per token (v0.6; writes: a fifth of it).
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      # Integrations (v0.5) – all optional. ENCRYPTION_KEY protects stored integration secrets
      # (SMTP password, Discord/webhook URLs, signing secrets, GitHub secrets): 32 random bytes,
      # e.g. openssl rand -base64 32. Back it up – without it stored secrets are unrecoverable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      # Email via environment variables (takes precedence over Administration → Email).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-}
      # Only for trusted single-tenant setups: allow webhooks to private network addresses.
      OUTBOUND_ALLOW_PRIVATE_NETWORKS: ${OUTBOUND_ALLOW_PRIVATE_NETWORKS:-false}
      # Fixed container paths – change the volume, not these.
      PORT: '3000'
      HOST: 0.0.0.0
      DATA_DIR: /data
    volumes:
      # Database (incl. WAL files), uploads and the generated secret. Never removed by updates.
      - tikket-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tikket-data:
