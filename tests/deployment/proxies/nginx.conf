# Mirrors what Nginx Proxy Manager generates for a proxy host (TLS termination, forwarded headers,
# upstream resolved through Docker DNS so container re-creation does not break routing).
events {}
http {
	client_max_body_size 25m;
	server {
		listen 443 ssl;
		server_name tikket.test;
		ssl_certificate /certs/cert.pem;
		ssl_certificate_key /certs/key.pem;
		location / {
			resolver 127.0.0.11 valid=10s;
			set $upstream http://tikket-app:3000;
			proxy_pass $upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
		}
	}
}
