# Optional: publishes a prebuilt multi-architecture image to GitHub Container Registry so
# deployments (including Coolify) can run Tikket without compiling it. Building from source
# with compose.yml remains fully supported.
#
# Tags:   vX.Y.Z git tag  → :X.Y.Z, :X.Y, :X and :latest
#         push to main    → :edge   (rolling, unreleased)
#         every build     → :sha-<short>
name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>; no other secrets are used
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Tikket
            org.opencontainers.image.description=Lightweight self-hosted issue and feedback tracker

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
